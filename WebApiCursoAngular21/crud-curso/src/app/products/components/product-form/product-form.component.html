<mat-card>
    <h2>{{isEditMode ? 'Edit product' : 'New product'}} </h2>
    <form [formGroup] = "productForm" (ngSubmit)="onSubmit()" >
        <mat-form-field class="full-width">
            <mat-label>Descripcion</mat-label>
            <input matInput formControlName="description" required>
            <mat-error *ngIf="productForm.get('description')?.invalid">
                Descrition is required (max 100 characters)
            </mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label>Stock</mat-label>
            <input matInput type="number" formControlName="stock" required>
            <mat-error *ngIf="productForm.get('stock')?.invalid">
                Stock is required and must be 0 or greater
            </mat-error>
        </mat-form-field>
        
        <div class="form-actions">
            <button mat-flat-button color="warm" type="submit" [disabled]="productForm.invalid" >
                {{isEditMode ? 'Update changes' : 'Add pproduct'}}
            </button>
            <button mat-raised-button color="warm" type="button" (click)="router.navigate(['/'])">
                Cancel
            </button>
        </div>
    </form>

</mat-card>
